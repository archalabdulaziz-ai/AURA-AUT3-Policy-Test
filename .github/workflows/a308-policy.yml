name: A308 Policy CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  policy-check:
    name: policy-check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Check safe fixture marker
        shell: bash
        run: |
          test "$(cat fixtures/a308-contract.txt)" = "PASS"